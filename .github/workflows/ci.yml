name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y samba samba-common-bin smbclient gnupg
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Portable Linux build
        run: bash scripts/portable-build.sh
      - run: python3 -B scripts/release.py --binary target/portable/cloudflare-disk
      - run: python3 -B scripts/release.py --verify dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
